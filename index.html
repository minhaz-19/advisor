<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EMS Advisor Dashboard</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            margin:0;
            padding:0;
        }

        .container{
            width:95%;
            max-width:1400px;
            margin:30px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
        }

        input, select{
            width:100%;
            padding:10px;
            margin-top:10px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:15px;
            background:#007bff;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:5px;
            font-size:16px;
        }

        button:hover{
            background:#0056b3;
        }

        .student-card{
            margin-top:20px;
            background:#f9f9f9;
            padding:20px;
            border-radius:10px;
            border:1px solid #ddd;
        }

        .info{
            margin-bottom:8px;
        }

        .label{
            font-weight:bold;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:15px;
        }

        table, th, td{
            border:1px solid #ddd;
        }

        th, td{
            padding:10px;
            text-align:center;
        }

        th{
            background:#007bff;
            color:white;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }

        #dashboard{
            display:none;
        }

        .loading{
            text-align:center;
            margin-top:20px;
            font-weight:bold;
            color:#007bff;
        }

        .subject-card{
            background:#f9f9f9;
            border:1px solid #ddd;
            border-radius:10px;
            padding:20px;
            margin-top:25px;
        }

        .subject-title{
            margin-top:0;
            color:#007bff;
        }

        .attendance-box{
            background:#ffffff;
            border:1px solid #ddd;
            border-radius:8px;
            padding:15px;
            margin-bottom:20px;
        }

        .attendance-grid{
            display:grid;
            grid-template-columns:
                repeat(auto-fit,minmax(180px,1fr));
            gap:10px;
        }

        .attendance-item{
            background:#f8f8f8;
            padding:10px;
            border-radius:6px;
        }

        .roll-container{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            margin-top:20px;
        }

        .roll-btn{
            width:auto;
            padding:10px 15px;
            background:#17a2b8;
            border:none;
            border-radius:6px;
            color:white;
            cursor:pointer;
        }

        .roll-btn:hover{
            background:#117a8b;
        }

    </style>

</head>

<body>



<div class="container" id="loginSection">

    <h2>EMS Login</h2>

    <input type="text"
           id="username"
           placeholder="Enter Username">

    <input type="password"
           id="password"
           placeholder="Enter Password">

    <button onclick="login()">
        Login
    </button>

</div>




<div class="container" id="dashboard">

    <h2>Advisor Dashboard</h2>

    <p id="welcomeText"></p>



    <!-- ROLL BUTTONS -->

    <h3>Select Student Roll</h3>

    <div class="roll-container"
         id="rollContainer"></div>



    <!-- STUDENT INFO -->

    <div id="studentContainer"></div>



    <!-- SEMESTER SECTION -->

    <div id="assessmentSection"
         style="display:none;">

        <h2>Assessment & Attendance Summary</h2>

        <select id="semesterSelect"></select>

        <button onclick="loadAssessmentMarks()">
            Show All Subject Details
        </button>

        <div class="loading"
             id="loadingText"></div>

        <div id="assessmentTable"></div>

    </div>

</div>




<script>

    // =====================================
    // FIXED ROLLS
    // =====================================

    const rolls = [

        "0802420205101083",
        "0802420105101084",
        "0802420105101087",
        "0802420105101088",
        "0802420205101090",
        "0802420105101092",
        "0802420205101093",
        "0802420205101094",
        "0802420205101095",
        "0802420205101096",
        "0802420105101097",
        "0802420205101099",
        "0802420205101100",
        "0802420105101101",
        "0802420105101102",
        "0802420405101103",
        "0802420205101105",
        "0802420405101106",
        "0802420105101107",
        "0802420105101108",
        "0802420105101109",
        "0802420205101112",
        "0802420105101113",
        "0802420105101114",
        "0802420105101115",
        "0802420405101118",
        "0802420105101119",
        "0802420105101120",
        "0802420105101122",
        "0802420205101123"

    ];


    // =====================================
    // GLOBAL VARIABLES
    // =====================================

    let accessToken = "";
    let studentId = null;
    let currentRoll = "";


    // =====================================
    // LOGIN
    // =====================================

    async function login(){

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;


        const payload = {

            username: username,
            password: password,
            targetCampusCode: "BAUST"
        };


        try{

            const response = await fetch(
                "https://api-ems.baust.edu.bd/api/authenticate",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":"application/json"
                    },

                    body: JSON.stringify(payload)
                }
            );


            const data = await response.json();


            if(data.success){

                accessToken =
                    data.data.accessToken;


                document.getElementById(
                    "loginSection"
                ).style.display = "none";


                document.getElementById(
                    "dashboard"
                ).style.display = "block";


                document.getElementById(
                    "welcomeText"
                ).innerHTML =
                    `<b>Welcome:</b> ${data.data.userInfo.displayName}`;


                createRollButtons();

            }
            else{

                alert("Login Failed!");
            }

        }
        catch(error){

            console.log(error);

            alert("Login Error!");
        }

    }



    // =====================================
    // CREATE ROLL BUTTONS
    // =====================================

    function createRollButtons(){

        let html = "";


        rolls.forEach(roll => {

            html += `
                <button class="roll-btn"
                        onclick="searchStudent('${roll}')">

                    ${roll}

                </button>
            `;
        });


        document.getElementById(
            "rollContainer"
        ).innerHTML = html;

    }




    // =====================================
    // SEARCH STUDENT
    // =====================================

    async function searchStudent(roll){

        currentRoll = roll;


        document.getElementById(
            "assessmentTable"
        ).innerHTML = "";


        const apiUrl =
            `https://api-ems.baust.edu.bd/semester/students/student-details-by-student-roll?studentRoll=${roll}`;


        try{

            const response = await fetch(
                apiUrl,
                {

                    method:"GET",

                    headers: {

                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );


            const result =
                await response.json();


            if(!result.success){

                alert("Student not found!");
                return;
            }


            const student =
                result.data;


            studentId =
                student.studentId;



            // ================================
            // STUDENT CARD
            // ================================

            document.getElementById(
                "studentContainer"
            ).innerHTML = `

                <div class="student-card">

                    <h3>
                        ${student.studentName}
                    </h3>

                    <div class="info">
                        <span class="label">
                            Roll:
                        </span>
                        ${student.studentRoll}
                    </div>

                    <div class="info">
                        <span class="label">
                            Department:
                        </span>
                        ${student.departmentName}
                    </div>

                    <div class="info">
                        <span class="label">
                            Batch:
                        </span>
                        ${student.batchName}
                    </div>

                    <div class="info">
                        <span class="label">
                            CGPA:
                        </span>
                        ${student.cgpa}
                    </div>

                </div>
            `;


            loadSemesters();

        }
        catch(error){

            console.log(error);

            alert("Student Fetch Error!");
        }

    }




    // =====================================
    // LOAD SEMESTERS
    // =====================================

    async function loadSemesters(){

        try{

            const response = await fetch(
                "https://api-ems.baust.edu.bd/course-offering/semester-list?isMainTerm=true",
                {

                    method:"GET",

                    headers: {

                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );


            const result =
                await response.json();


            const semesters =
                result.data;


            let options = "";


            semesters.forEach(semester => {

                options += `
                    <option value="${semester.semesterId}">
                        ${semester.name}
                    </option>
                `;
            });


            document.getElementById(
                "semesterSelect"
            ).innerHTML = options;


            document.getElementById(
                "assessmentSection"
            ).style.display = "block";

        }
        catch(error){

            console.log(error);

            alert("Semester Load Error!");
        }

    }




    // =====================================
    // LOAD ASSESSMENT + ATTENDANCE
    // =====================================

    async function loadAssessmentMarks(){

        const semesterId =
            document.getElementById(
                "semesterSelect"
            ).value;


        document.getElementById(
            "loadingText"
        ).innerHTML =
            "Loading data...";


        try{

            // ================================
            // LOAD COURSES
            // ================================

            const courseApi =
                `https://api-ems.baust.edu.bd/admin-panel/student/registered-course-list-by-semester?semesterId=${semesterId}&studentId=${studentId}`;


            const courseResponse =
                await fetch(
                    courseApi,
                    {

                        method:"GET",

                        headers: {

                            "Authorization":
                                `Bearer ${accessToken}`
                        }
                    }
                );


            const courseResult =
                await courseResponse.json();


            const courses =
                courseResult.data;



            // ================================
            // LOAD ATTENDANCE
            // ================================

            const attendanceApi =
                `https://api-ems.baust.edu.bd/admin-panel/student/attendance-summary-per-student?studentRoll=${currentRoll}&semesterId=${semesterId}`;


            const attendanceResponse =
                await fetch(
                    attendanceApi,
                    {

                        method:"GET",

                        headers: {

                            "Authorization":
                                `Bearer ${accessToken}`
                        }
                    }
                );


            const attendanceResult =
                await attendanceResponse.json();


            let attendanceList = [];


            if(
                attendanceResult.success &&
                attendanceResult.data &&
                attendanceResult.data.attendanceSummary
            ){

                attendanceList =
                    attendanceResult.data.attendanceSummary;
            }



            // ================================
            // ALL SUBJECT CARDS
            // ================================

            let allCards = "";



            // ================================
            // LOOP COURSES
            // ================================

            for(const course of courses){

                try{

                    const runningCourseId =
                        course.value;

                    const courseName =
                        course.label;



                    // ============================
                    // FIND ATTENDANCE
                    // ============================

                    const attendance =
                        attendanceList.find(
                            item =>
                                item.runningCourseId ==
                                runningCourseId
                        );



                    // ============================
                    // LOAD MARKS
                    // ============================

                    const marksApi =
                        `https://api-ems.baust.edu.bd/admin-panel/student/continuous-assessment-list-of-semester?runningCourseId=${runningCourseId}&studentId=${studentId}`;


                    const marksResponse =
                        await fetch(
                            marksApi,
                            {

                                method:"GET",

                                headers: {

                                    "Authorization":
                                        `Bearer ${accessToken}`
                                }
                            }
                        );


                    const marksResult =
                        await marksResponse.json();


                    if(!marksResult.success){

                        continue;
                    }


                    const assessments =
                        marksResult.data;



                    // ============================
                    // SUBJECT CARD
                    // ============================

                    let card = `

                        <div class="subject-card">

                            <h3 class="subject-title">
                                ${courseName}
                            </h3>



                            <div class="attendance-box">

                                <h4>
                                    Attendance Summary
                                </h4>

                                <div class="attendance-grid">

                                    <div class="attendance-item">
                                        <b>Present</b><br>
                                        ${attendance?.presentCount ?? "-"}
                                    </div>

                                    <div class="attendance-item">
                                        <b>Absent</b><br>
                                        ${attendance?.absentCount ?? "-"}
                                    </div>

                                    <div class="attendance-item">
                                        <b>Total</b><br>
                                        ${attendance?.totalClass ?? "-"}
                                    </div>

                                    <div class="attendance-item">
                                        <b>Percentage</b><br>
                                        ${attendance?.percentage ?? "-"}%
                                    </div>

                                </div>

                            </div>



                            <table>

                                <tr>
                                    <th>Assessment</th>
                                    <th>Total</th>
                                    <th>Obtained</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                </tr>
                    `;



                    // ============================
                    // ADD ROWS
                    // ============================

                    assessments.forEach(item => {

                        card += `

                            <tr>

                                <td>
                                    ${item.assessmentName ?? "-"}
                                </td>

                                <td>
                                    ${item.totalMarks ?? "-"}
                                </td>

                                <td>
                                    ${item.obtainedMarks ?? "-"}
                                </td>

                                <td>
                                    ${item.marksStatus ?? "-"}
                                </td>

                                <td>
                                    ${item.assessmentDate ?? "-"}
                                </td>

                            </tr>
                        `;
                    });


                    card += `
                            </table>
                        </div>
                    `;


                    allCards += card;

                }
                catch(innerError){

                    console.log(innerError);
                }

            }



            // ================================
            // SHOW ALL CARDS
            // ================================

            document.getElementById(
                "assessmentTable"
            ).innerHTML = allCards;


            document.getElementById(
                "loadingText"
            ).innerHTML = "";

        }
        catch(error){

            console.log(error);

            alert("Data Load Error!");
        }

    }

</script>

</body>

</html>
